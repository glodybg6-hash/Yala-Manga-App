<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ligue de Judoka</title>
    <!-- On relie le fichier CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Écran du Jeu en Mode Paysage -->
    <div id="jeu-container">
        
        <!-- Côté Gauche : Main Gauche -->
        <div class="commandes-gauche">
            <button id="btn-main-gauche">Main Gauche</button>
        </div>

        <!-- Centre : Tatami / Score / Infos -->
        <div class="zone-tatami">
            <h2 id="nom-joueur">Simapinga Kasongo</h2>
            <div id="score">0 - 0</div>
            <div id="argent">Argent: 0 $</div>
        </div>

        <!-- Côté Droit : Main Droite & Attaques -->
        <div class="commandes-droite">
            <button id="btn-main-droite">Main Droite</button>
            <button id="btn-patte">Balayage</button>
        </div>

    </div>

    <!-- On relie le fichier JavaScript -->
    <script src="script.js"></script>
</body>
</html>
