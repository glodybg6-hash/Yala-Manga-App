<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yala Creator - Studio IA Avancé</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161b22;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            border: 1px solid #30363d;
        }
        h1 {
            color: #ff9f43;
            text-align: center;
            margin-top: 5px;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            color: #ffa502;
            font-weight: bold;
            font-size: 13px;
        }
        textarea, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background: #21262d;
            border: 1px solid #30363d;
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-action {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
        }
        .btn-ai { background-color: #1e90ff; color: white; }
        .btn-upload { background-color: #8e44ad; color: white; }
        .btn-generate { background-color: #ff9f43; color: white; font-size: 16px; margin-top: 20px; }
        .btn-download { background-color: #2ea043; color: white; display: none; text-decoration: none; box-sizing: border-box; margin-top: 12px; text-align: center; }
        
        .tv-player {
            width: 100%;
            height: 280px;
            background: #000;
            border: 3px solid #ff9f43;
            border-radius: 14px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #animCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .status-box {
            background: #21262d;
            padding: 12px;
            border-left: 4px solid #58a6ff;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #c9d1d9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Yala Creator 🎬</h1>
    <div class="subtitle">Studio Manga - Test IA & Expression</div>

    <label for="promptInput">1. Texte / Dialogue du Personnage :</label>
    <textarea id="promptInput" rows="2" placeholder="Ex: Mampinga Kasongo : Les méchants sont là, regard perçant !"></textarea>
    
    <label for="expressionSelect">2. Expression & Style de Mouvement :</label>
    <select id="expressionSelect">
        <option value="furieux">Regard furieux / Combat intense</option>
        <option value="parole">Effet de parole / Mouvement de bouche</option>
        <option value="puissance">Déchainement de puissance & Zoom rapide</option>
    </select>

    <button class="btn-action btn-ai" onclick="genererScenarioIA()">🤖 Générer Scénario Intelligent</button>

    <label>3. Importer l'image du Manga :</label>
    <button class="btn-action btn-upload" onclick="document.getElementById('mediaUpload').click()">📁 Choisir l'image</button>
    <input type="file" id="mediaUpload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">

    <button class="btn-action btn-generate" onclick="lancerCreationAvancee()">▶️ Créer la Vidéo Animée</button>

    <!-- Écran Télévision -->
    <div class="tv-player">
        <canvas id="animCanvas" width="600" height="350"></canvas>
    </div>

    <!-- Téléchargement -->
    <a id="downloadVideoBtn" class="btn-action btn-download">📥 Télécharger la Vidéo (.webm)</a>

    <div class="status-box" id="statusBox">
        Statut : Studio prêt pour le test des expressions et de la voix.
    </div>
</div>

<script>
    const canvas = document.getElementById('animCanvas');
    const ctx = canvas.getContext('2d');
    let uploadedImage = null;
    let mediaRecorder;
    let recordedChunks = [];

    const scenariosIntelligents = [
        "Mampinga Kasongo : 'Le regard froid, les méchants ne pourront pas m'échapper !'",
        "Mampinga Kasongo : 'Préparez-vous à subir la fureur de ma lame !'",
        "Mampinga Kasongo : 'Rien ne peut arrêter le sang d'un roi !'"
    ];

    function genererScenarioIA() {
        const randomIndex = Math.floor(Math.random() * scenariosIntelligents.length);
        document.getElementById('promptInput').value = scenariosIntelligents[randomIndex];
        document.getElementById('statusBox').innerHTML = "🤖 Scénario intelligent généré avec succès !";
    }

    let defaultImg = new Image();
    defaultImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='350' fill='%23111'><rect width='600' height='350'/><text x='300' y='175' fill='%23ff9f43' font-family='Arial' font-size='16' text-anchor='middle'>Studio Yala IA Prêt</text></svg>";
    defaultImg.onload = () => ctx.drawImage(defaultImg, 0, 0, canvas.width, canvas.height);

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    uploadedImage = img;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                    document.getElementById('statusBox').innerHTML = "✅ Image chargée avec succès !";
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    }

    function lancerCreationAvancee() {
        const text = document.getElementById('promptInput').value || "Yala Creator";
        const mode = document.getElementById('expressionSelect').value;
        const statusBox = document.getElementById('statusBox');
        const downloadBtn = document.getElementById('downloadVideoBtn');

        downloadBtn.style.display = "none";
        statusBox.innerHTML = "🎙️ Synthèse vocale et animation intelligente en cours...";

        // Lancer la voix du téléphone
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        const stream = canvas.captureStream(30);
        recordedChunks = [];

        try {
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        } catch (e) {
            try { mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' }); } 
            catch (err) { mediaRecorder = new MediaRecorder(stream); }
        }

        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            downloadBtn.href = URL.createObjectURL(blob);
            downloadBtn.download = "yala_manga_ia.webm";
            downloadBtn.style.display = "block";
            statusBox.innerHTML = "🎉 Vidéo intelligente prête ! Clique sur le bouton vert.";
        };

        mediaRecorder.start();

        let startTime = null;
        let durationSec = 6;
        let imgToDraw = uploadedImage || defaultImg;

        function renderFrame(timestamp) {
            if (!startTime) startTime = timestamp;
            let elapsed = (timestamp - startTime) / 1000;

            if (elapsed < durationSec) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Effets visuels selon le mode choisi (regard furieux, vibration, zoom)
                let scale = 1;
                let offsetX = 0;
                let offsetY = 0;

                if (mode === 'furieux') {
                    // Zoom et légère vibration pour l'effet de colère
                    scale = 1 + (elapsed * 0.04);
                    offsetX = (Math.random() - 0.5) * 4;
                    offsetY = (Math.random() - 0.5) * 4;
                } else if (mode === 'parole') {
                    // Pulsation rythmique pour simuler la parole
                    scale = 1 + Math.sin(elapsed * 10) * 0.02;
                } else {
                    // Puissance / Zoom rapide
                    scale = 1 + (elapsed * 0.08);
                }

                let w = canvas.width * scale;
                let h = canvas.height * scale;
                let x = (canvas.width - w) / 2 + offsetX;
                let y = (canvas.height - h) / 2 + offsetY;

                ctx.save();
                ctx.drawImage(imgToDraw, x, y, w, h);
                ctx.restore();

                // Bandeau texte
                ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
                ctx.fillRect(0, canvas.height - 55, canvas.width, 55);

                ctx.fillStyle = "#fffa65";
                ctx.font = "bold 14px Arial";
                ctx.textAlign = "center";
                ctx.fillText(text, canvas.width / 2, canvas.height - 22);

                requestAnimationFrame(renderFrame);
            } else {
                mediaRecorder.stop();
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            }
        }

        requestAnimationFrame(renderFrame);
    }
</script>

</body>
</html>
