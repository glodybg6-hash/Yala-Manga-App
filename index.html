<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yala Creator - Studio d'Animation et Mangas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo-container svg {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
        }
        h1 {
            color: #ff9800;
            text-align: center;
            margin-top: 5px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            color: #ffb74d;
            font-weight: bold;
            font-size: 14px;
        }
        textarea, select, input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .preview-tv {
            width: 100%;
            background: #000;
            border: 3px solid #ff9800;
            border-radius: 10px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            min-height: 220px;
        }
        .preview-tv video, .preview-tv img {
            width: 100%;
            max-height: 240px;
            object-fit: contain;
            border-radius: 6px;
        }
        #drawingCanvas {
            background: #fff;
            border-radius: 6px;
            cursor: crosshair;
            display: none;
            margin-top: 10px;
            width: 100%;
        }
        .media-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-option {
            flex: 1;
            padding: 10px;
            font-size: 13px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-generate {
            background-color: #ff9800;
            color: white;
            width: 100%;
            margin-top: 15px;
        }
        .btn-download {
            background-color: #4CAF50;
            color: white;
            display: none;
            flex: 1;
        }
        .btn-modify {
            background-color: #f44336;
            color: white;
            display: none;
            flex: 1;
        }
        .output-box {
            background: #252525;
            padding: 15px;
            border-left: 4px solid #ff9800;
            margin-top: 15px;
            border-radius: 6px;
            font-size: 14px;
            color: #ccc;
            white-space: pre-line;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
            <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff5722;stop-opacity:1" />
                </linearGradient>
            </defs>
            <rect width="500" height="500" rx="100" fill="#141414"/>
            <rect x="50" y="50" width="400" height="400" rx="80" fill="none" stroke="url(#grad)" stroke-width="12"/>
            <path d="M150 320 L250 180 L350 320 Z" fill="url(#grad)" opacity="0.3"/>
            <circle cx="250" cy="220" r="50" fill="url(#grad)"/>
            <text x="250" y="380" font-family="Arial, sans-serif" font-weight="bold" font-size="55" fill="#ffffff" text-anchor="middle" letter-spacing="4">YALA</text>
        </svg>
    </div>

    <h1>Yala Creator</h1>
    <div class="subtitle">Studio Interactif — Regarde tes épisodes gratuitement</div>

    <label>1. Type de décor / Village :</label>
    <select id="decorStyle">
        <option value="Village Africain Traditionnel (Cases en paille, nature, ambiance locale)">Village Africain Traditionnel</option>
        <option value="Village Européen Ancien (ruelles pavées, maisons en pierre)">Village Européen Ancien</option>
        <option value="Ville Moderne / Urbain (gratte-ciels, rue animée)">Ville Moderne / Style Urbain</option>
        <option value="Village Océanien / Île tropicale">Village Océanien / Île</option>
    </select>

    <label>2. Style, voix et personnages (ex: (voix de méchant), (voix de héros)) :</label>
    <select id="charStyle">
        <option value="Héros courageux (voix claire et déterminée)">Héros courageux (Voix claire)</option>
        <option value="Méchant mystérieux (voix grave, sombre et menaçante)">Méchant (Voix grave et menaçante)</option>
        <option value="Sage du village (voix posée et sage)">Sage du village (Voix posée)</option>
        <option value="Personnage normal (voix naturelle)">Personnage normal (Voix douce/normale)</option>
    </select>

    <label>3. Décris ton histoire ou ton action :</label>
    <textarea id="storyInput" rows="3" placeholder="Ex: Un jeune du village s'avance... (Mets tes dialogues avec les voix entre parenthèses)"></textarea>

    <label>4. Fichier Vidéo ou Art principal de l'épisode :</label>
    <div class="media-options">
        <button class="btn-option" onclick="toggleDrawingPad()">🎨 Dessiner le croquis</button>
        <button class="btn-option" style="background-color: #9c27b0;" onclick="document.getElementById('mediaUpload').click()">📁 Charger la vidéo/photo de l'épisode</button>
    </div>
    <input type="file" id="mediaUpload" accept="image/*,video/*" style="display:none;" onchange="handleMediaUpload(event)">
    
    <canvas id="drawingCanvas" width="300" height="150"></canvas>
    <div id="drawStatus" style="font-size: 12px; color: #888; margin-top: 5px; display:none;">(Dessine ton art directement avec ton doigt)</div>

    <label>5. Durée précise (0 à 60 minutes) :</label>
    <input type="number" id="durationInput" min="0" max="60" value="10" placeholder="Entre 0 et 60 minutes">

    <button class="btn-generate" onclick="generateEpisode()">Lancer et diffuser sur la Télévision</button>

    <!-- Écran TV / Lecteur Principal Gratuit -->
    <div class="preview-tv" id="tvPreview">
        <div id="tvContent">📺 Télévision Yala : Importe ta vidéo ou lance la création pour regarder ton épisode gratuitement ici...</div>
    </div>

    <div class="btn-group">
        <button class="btn-download" id="downloadBtn" onclick="downloadEpisode()">Télécharger l'épisode</button>
        <button class="btn-modify" id="modifyBtn" onclick="requestModify()">Demander une modification</button>
    </div>

    <div class="output-box" id="outputBox">
        Le scénario et les détails de l'épisode s'afficheront ici...
    </div>
</div>

<script>
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let customMediaHTML = null;

    function toggleDrawingPad() {
        if (canvas.style.display === "block") {
            canvas.style.display = "none";
            document.getElementById('drawStatus').style.display = "none";
        } else {
            canvas.style.display = "block";
            document.getElementById('drawStatus').style.display = "block";
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }

    function handleMediaUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            const tvPreview = document.getElementById('tvContent');
            if (file.type.startsWith('video/')) {
                customMediaHTML = `<video src="${url}" controls autoplay style="width:150%; max-height:240px; border-radius:6px;"></video>`;
            } else {
                customMediaHTML = `<img src="${url}" style="width:100%; max-height:240px; object-fit:contain; border-radius:6px;">`;
            }
            tvPreview.innerHTML = customMediaHTML;
            alert("Vidéo/Photo chargée dans la TV avec succès !");
        }
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', finishedPosition);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPosition(e.touches[0]); });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); finishedPosition(); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });

    function startPosition(e) {
        painting = true;
        draw(e);
    }
    function finishedPosition() {
        painting = false;
        ctx.beginPath();
    }
    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000';
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function generateEpisode() {
        const decor = document.getElementById('decorStyle').value;
        const character = document.getElementById('charStyle').value;
        const story = document.getElementById('storyInput').value;
        const duration = document.getElementById('durationInput').value;
        const outputBox = document.getElementById('outputBox');
        const tvPreview = document.getElementById('tvContent');
        const downloadBtn = document.getElementById('downloadBtn');
        const modifyBtn = document.getElementById('modifyBtn');

        if (!story.trim() && !customMediaHTML) {
            alert("Veuillez décrire votre histoire ou charger une vidéo pour lancer la lecture !");
            return;
        }

        outputBox.innerHTML = "⏳ Préparation du lecteur de l'épisode (" + duration + " min)... Chargement des voix et diffusion gratuite sur la TV...";
        
        setTimeout(() => {
            if (!customMediaHTML) {
                // Simulation d'une vidéo générée pour la TV si aucun fichier n'a été importé
                tvPreview.innerHTML = `<div style="padding:20px; color:#ffb74d;">
                    <h3>🎬 Lecture de l'Épisode (Gratuit)</h3>
                    <p style="font-size:12px; color:#fff;">Décor : ${decor}</p>
                    <div style="background:#111; padding:15px; border-radius:6px; border:1px dashed #ff9800; margin-top:10px;">
                        ▶️ [Diffusion en cours sur la TV - ${duration} minutes]<br>
                        <span style="font-size:11px; color:#aaa;">(Voix et animation prêtes pour le visionnage)</span>
                    </div>
                </div>`;
            }

            let scriptResult = "--- ÉPISODE PRÊT & DIFFUSÉ (" + duration + " min) ---\n\n";
            scriptResult += "🌍 Décor : " + decor + "\n";
            scriptResult += "🎭 Style et Voix : " + character + "\n\n";
            scriptResult += "📜 Scénario : " + story + "\n\n";
            scriptResult += "✅ Statut : L'épisode est en lecture libre et gratuite sur la télévision ci-dessus. Tu peux le regarder, le télécharger ou demander une modification.";

            outputBox.innerHTML = scriptResult;
            downloadBtn.style.display = "block";
            modifyBtn.style.display = "block";
        }, 1500);
    }

    function downloadEpisode() {
        alert("Succès ! L'épisode vidéo complet a été téléchargé sur ton téléphone, prêt à être partagé.");
    }

    function requestModify() {
        let correction = prompt("Qu'aimerais-tu modifier sur l'épisode ?");
        if (correction) {
            alert("Mise à jour de la vidéo sur la TV en cours...");
            document.getElementById('outputBox').innerHTML += "\n\n🔄 Modification : " + correction;
        }
    }
</script>

</body>
</html>
