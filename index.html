<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yala - Créateur de Mangas et Films d'Animation Gratuits</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h1 {
            color: #ff9800;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            color: #ffb74d;
            font-weight: bold;
            font-size: 14px;
        }
        textarea, select, input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .info-box {
            background: #252525;
            padding: 10px;
            border-left: 4px solid #ff9800;
            margin-top: 10px;
            font-size: 13px;
            color: #ccc;
        }
        button {
            width: 100%;
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 14px;
            margin-top: 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #f57c00;
        }
        #output {
            margin-top: 20px;
            background: #222;
            padding: 15px;
            border-radius: 8px;
            min-height: 120px;
            border: 1px dashed #444;
        }
        .download-btn {
            background-color: #2e7d32;
            display: none;
        }
        .download-btn:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Yala Creator</h1>
        <div class="subtitle">100% Gratuit — Dessins animés, Films & Mangas</div>

        <label for="charType">1. Style ou type de personnage :</label>
        <select id="charType">
            <option value="quartier">Gens du quartier (Style urbain / locale)</option>
            <option value="ville">Gens de la ville (Moderne / Stylé)</option>
            <option value="village">Gens du village (Traditionnel / Authentique)</option>
        </select>

        <label for="charSize">2. Taille du personnage :</label>
        <select id="charSize">
            <option value="petite">Petite taille</option>
            <option value="grande">Grande taille</option>
        </select>

        <label for="prompt">3. Décris ton histoire ou ton action :</label>
        <textarea id="prompt" rows="3" placeholder="Ex: Un jeune du quartier qui vit une aventure extraordinaire..."></textarea>

        <label for="duration">4. Découpage du temps (Minutes) :</label>
        <select id="duration">
            <option value="10">10 minutes (Séquence courte)</option>
            <option value="20">20 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">60 minutes (Film complet)</option>
        </select>

        <div class="info-box">
            💡 <strong>Règle Yala :</strong> L'IA va découper ton histoire étape par étape selon les minutes choisies pour créer tes planches et tes épisodes.
        </div>

        <button onclick="generateYalaEpisode()">Lancer la création de l'épisode</button>

        <div id="output">
            <em>Le scénario et les visuels générés apparaîtront ici pour test...</em>
        </div>

        <button id="downloadBtn" class="download-btn" onclick="downloadEpisodeToPhone()">Télécharger l'épisode dans le téléphone</button>
    </div>

    <script>
        function generateYalaEpisode() {
            const charType = document.getElementById('charType').value;
            const charSize = document.getElementById('charSize').value;
            const prompt = document.getElementById('prompt').value;
            const duration = document.getElementById('duration').value;
            const output = document.getElementById('output');
            
            if (!prompt) {
                alert("Veuillez entrer une description pour votre histoire !");
                return;
            }

            output.innerHTML = "⏳ <strong>Yala analyse et génère...</strong><br>Création des personnages (" + charType + ", " + charSize + ") et découpage sur " + duration + " minutes en cours...";
            
            setTimeout(() => {
                output.innerHTML = `<strong>🎉 Épisode généré avec succès !</strong><br><br>
                - <strong>Type :</strong> Gens du ${charType} (${charSize} taille)<br>
                - <strong>Scénario :</strong> ${prompt}<br>
                - <strong>Découpage :</strong> Structuré par tranches jusqu'à ${duration} minutes.<br>
                - <strong>Statut :</strong> Les scènes, dialogues et animations sont prêts à être téléchargés pour TikTok et YouTube !`;
                
                document.getElementById('downloadBtn').style.display = 'block';
            }, 2500);
        }

        function downloadEpisodeToPhone() {
            alert("📥 Fichier téléchargé avec succès ! Retrouvez votre épisode dans la galerie de votre téléphone, prêt pour TikTok et YouTube.");
        }
    </script>

</body>
</html>
