<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yala Creator - Studio Manga & IA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161b22;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            border: 1px solid #30363d;
        }
        h1 {
            color: #ff9f43;
            text-align: center;
            margin-top: 5px;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            color: #ffa502;
            font-weight: bold;
            font-size: 14px;
        }
        textarea, input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background: #21262d;
            border: 1px solid #30363d;
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .player-box {
            width: 100%;
            height: 280px;
            background: #000;
            border: 3px solid #ff9f43;
            border-radius: 14px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .btn-main {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background-color: #ff9f43;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .status-box {
            background: #21262d;
            padding: 12px;
            border-left: 4px solid #58a6ff;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #c9d1d9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Yala Creator 🎬</h1>
    <div class="subtitle">Studio Manga & Générateur Intelligent (Étape 1)</div>

    <label for="promptInput">1. Idée de la scène ou Histoire Manga :</label>
    <textarea id="promptInput" rows="3" placeholder="Ex: Simapinga Kasongo prépare sa plus grande attaque..."></textarea>

    <label for="styleSelect">2. Choisis le style d'animation :</label>
    <select id="styleSelect">
        <option value="manga">Manga Action / Combat</option>
        <option value="anime">Anime Coloré</option>
        <option value="dark">Style Sombre / Peaky</option>
    </select>

    <button class="btn-main" onclick="genererManga()">🚀 Lancer la Génération</button>

    <!-- Écran du Studio -->
    <div class="player-box" id="playerBox">
        <p style="color: #8b949e; text-align: center;">📺 Écran Télévision Studio<br><small>Le résultat s'affichera ici</small></p>
    </div>

    <div class="status-box" id="statusBox">
        Statut : Squelette prêt. En attente de la deuxième étape !
    </div>
</div>

<script>
    function genererManga() {
        const text = document.getElementById('promptInput').value;
        const statusBox = document.getElementById('statusBox');
        if (!text) {
            statusBox.innerHTML = "⚠️ Écris une histoire ou une idée d'abord !";
            return;
        }
        statusBox.innerHTML = "⚡ Interface prête ! Prochaine étape : connexion du moteur IA.";
    }
</script>

</body>
</html>
