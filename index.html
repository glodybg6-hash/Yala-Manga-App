<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yala Creator - Studio Multi-Scènes Pro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161b22;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            border: 1px solid #30363d;
        }
        h1 {
            color: #ff9f43;
            text-align: center;
            margin-top: 5px;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 20px;
        }
        .scene-card {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #ffa502;
            font-weight: bold;
            font-size: 13px;
        }
        textarea, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-action {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }
        .btn-ai { background-color: #1e90ff; color: white; }
        .btn-upload { background-color: #8e44ad; color: white; }
        .btn-add { background-color: #238636; color: white; margin-top: 15px; }
        .btn-generate { background-color: #ff9f43; color: white; font-size: 16px; margin-top: 20px; }
        .btn-download { background-color: #2ea043; color: white; display: none; text-decoration: none; box-sizing: border-box; margin-top: 12px; text-align: center; }
        
        .tv-player {
            width: 100%;
            height: 280px;
            background: #000;
            border: 3px solid #ff9f43;
            border-radius: 14px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #animCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .status-box {
            background: #21262d;
            padding: 12px;
            border-left: 4px solid #58a6ff;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #c9d1d9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Yala Creator 🎬</h1>
    <div class="subtitle">Studio Manga Multi-Scènes (Étape 2)</div>

    <div id="scenesContainer">
        <!-- Scène 1 par défaut -->
        <div class="scene-card" id="scene-0">
            <label>Scène 1 - Texte / Dialogue :</label>
            <textarea rows="2" class="scene-text" placeholder="Ex: Simapinga Kasongo entre dans l'arène..."></textarea>
            
            <label>Image de la Scène 1 :</label>
            <button class="btn-action btn-upload" onclick="triggerUpload(0)">📁 Choisir l'image</button>
            <input type="file" id="file-0" accept="image/*" style="display:none;" onchange="handleSceneImage(event, 0)">
            <div id="img-name-0" style="font-size:11px; color:#8b949e; margin-top:4px;">Aucune image sélectionnée</div>
        </div>
    </div>

    <button class="btn-action btn-add" onclick="ajouterScene()">➕ Ajouter une autre Scène</button>

    <button class="btn-action btn-generate" onclick="lancerStudioGlobal()">▶️ Créer la Vidéo de toutes les Scènes</button>

    <!-- Écran Télévision Studio -->
    <div class="tv-player">
        <canvas id="animCanvas" width="600" height="350"></canvas>
    </div>

    <!-- Téléchargement de la vidéo -->
    <a id="downloadVideoBtn" class="btn-action btn-download">📥 Télécharger la Vidéo (.webm)</a>

    <div class="status-box" id="statusBox">
        Statut : Studio multi-scènes prêt. Ajoute tes scènes et lance la création !
    </div>
</div>

<script>
    const canvas = document.getElementById('animCanvas');
    const ctx = canvas.getContext('2d');
    let scenes = [{ text: "", image: null, imageName: "" }];
    let mediaRecorder;
    let recordedChunks = [];

    let defaultImg = new Image();
    defaultImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='350' fill='%23111'><rect width='600' height='350'/><text x='300' y='175' fill='%23ff9f43' font-family='Arial' font-size='16' text-anchor='middle'>Studio Yala Multi-Scènes</text></svg>";
    defaultImg.onload = () => ctx.drawImage(defaultImg, 0, 0, canvas.width, canvas.height);

    function triggerUpload(index) {
        document.getElementById(`file-${index}`).click();
    }

    function handleSceneImage(event, index) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    scenes[index].image = img;
                    scenes[index].imageName = file.name;
                    document.getElementById(`img-name-${index}`).innerText = "✅ " + file.name;
                    document.getElementById('statusBox').innerHTML = `Image de la scène ${index + 1} chargée !`;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    }

    function ajouterScene() {
        const index = scenes.length;
        scenes.push({ text: "", image: null, imageName: "" });

        const container = document.getElementById('scenesContainer');
        const card = document.createElement('div');
        card.className = 'scene-card';
        card.id = `scene-${index}`;
        card.innerHTML = `
            <label>Scène ${index + 1} - Texte / Dialogue :</label>
            <textarea rows="2" class="scene-text" placeholder="Ex: L'attaque ultime commence..."></textarea>
            
            <label>Image de la Scène ${index + 1} :</label>
            <button class="btn-action btn-upload" onclick="triggerUpload(${index})">📁 Choisir l'image</button>
            <input type="file" id="file-${index}" accept="image/*" style="display:none;" onchange="handleSceneImage(event, ${index})">
            <div id="img-name-${index}" style="font-size:11px; color:#8b949e; margin-top:4px;">Aucune image sélectionnée</div>
        `;
        container.appendChild(card);
        document.getElementById('statusBox').innerHTML = `Scène ${index + 1} ajoutée au studio !`;
    }

    function lancerStudioGlobal() {
        // Récupérer les textes saisis
        const textAreas = document.querySelectorAll('.scene-text');
        textAreas.forEach((ta, idx) => {
            if (scenes[idx]) scenes[idx].text = ta.value || `Scène ${idx + 1}`;
        });

        const statusBox = document.getElementById('statusBox');
        const downloadBtn = document.getElementById('downloadVideoBtn');
        downloadBtn.style.display = "none";
        statusBox.innerHTML = "🎬 Enregistrement du film multi-scènes en cours...";

        const stream = canvas.captureStream(30);
        recordedChunks = [];

        try {
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        } catch (e) {
            try { mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' }); } 
            catch (err) { mediaRecorder = new MediaRecorder(stream); }
        }

        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            downloadBtn.href = URL.createObjectURL(blob);
            downloadBtn.download = "yala_film_manga.webm";
            downloadBtn.style.display = "block";
            statusBox.innerHTML = "🎉 Film manga complet prêt ! Clique sur le bouton vert.";
        };

        mediaRecorder.start();

        // Paramètres de lecture des scènes à la suite
        let currentSceneIndex = 0;
        let sceneDuration = 5; // 5 secondes par scène
        let startTime = null;

        function renderTimeline(timestamp) {
            if (!startTime) startTime = timestamp;
            let elapsed = (timestamp - startTime) / 1000;

            if (currentSceneIndex < scenes.length) {
                if (elapsed < sceneDuration) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    let currentImg = scenes[currentSceneIndex].image || defaultImg;
                    let currentText = scenes[currentSceneIndex].text;

                    // Zoom dynamique
                    let scale = 1 + (elapsed * 0.02);
                    let w = canvas.width * scale;
                    let h = canvas.height * scale;
                    let x = (canvas.width - w) / 2;
                    let y = (canvas.height - h) / 2;

                    ctx.save();
                    ctx.drawImage(currentImg, x, y, w, h);
                    ctx.restore();

                    // Sous-titre
                    ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                    ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

                    ctx.fillStyle = "#fffa65";
                    ctx.font = "bold 14px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(currentText, canvas.width / 2, canvas.height - 18);

                    requestAnimationFrame(renderTimeline);
                } else {
                    // Passer à la scène suivante
                    currentSceneIndex++;
                    startTime = null;
                    if (currentSceneIndex < scenes.length) {
                        // Lire la voix de la scène suivante si dispo
                        if ('speechSynthesis' in window) {
                            const utterance = new SpeechSynthesisUtterance(scenes[currentSceneIndex].text);
                            utterance.lang = 'fr-FR';
                            window.speechSynthesis.speak(utterance);
                        }
                    }
                    requestAnimationFrame(renderTimeline);
                }
            } else {
                mediaRecorder.stop();
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            }
        }

        // Lancer la première voix
        if ('speechSynthesis' in window && scenes.length > 0) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(scenes[0].text);
            utterance.lang = 'fr-FR';
            window.speechSynthesis.speak(utterance);
        }

        requestAnimationFrame(renderTimeline);
    }
</script>

</body>
</html>
