<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JDM - Console Portable Offline</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* En-tête de la console */
        header {
            background: linear-gradient(90deg, #1f2937, #111827);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3b82f6;
            height: 60px;
        }
        h1 {
            margin: 0;
            font-size: 20px;
            color: #60a5fa;
            letter-spacing: 1px;
        }

        /* Conteneur principal du catalogue */
        .main-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .game-card {
            background-color: #1f2937;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.3s;
            cursor: pointer;
        }
        .game-card:hover {
            border-color: #3b82f6;
        }
        .game-screen {
            background: #374151;
            height: 100px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
        .game-title {
            font-size: 14px;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }
        .btn-download {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-download:hover {
            background-color: #2563eb;
        }

        /* Écran de jeu en mode Paysage (Caché par défaut) */
        #game-emulator-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 100;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .emulator-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-back {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Zone centrale du jeu (Grand écran horizontal) */
        .emulator-viewport {
            flex: 1;
            background: #111;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
            font-size: 18px;
            color: #888;
        }

        /* Manette intégrée sur les côtés en mode paysage (façon PSP/PS Vita) */
        .emulator-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .d-pad, .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 2px;
            align-items: center;
            justify-items: center;
        }

        .ps-btn {
            background-color: #1f2937;
            color: white;
            border: 2px solid #4b5563;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }
        .ps-btn:active {
            background-color: #3b82f6;
        }
    </style>
</head>
<body>

    <!-- Menu Principal / Bibliothèque -->
    <header>
        <h1>JDM — CONSOLE OFFLINE</h1>
        <div style="font-size: 14px; color: #9ca3af;">1000+ Jeux Disponibles</div>
    </header>

    <div class="main-container">
        <!-- Jeu 1 -->
        <div class="game-card">
            <div class="game-screen">🎮 GTA San Andreas</div>
            <div class="game-title">GTA San Andreas</div>
            <button class="btn-download" onclick="lancerJeu('GTA San Andreas')">Télécharger & Jouer</button>
        </div>
        <!-- Jeu 2 -->
        <div class="game-screen-card game-card">
            <div class="game-screen">⚽ Foot 2028</div>
            <div class="game-title">Super League 2028</div>
            <button class="btn-download" onclick="lancerJeu('Super League 2028')">Télécharger & Jouer</button>
        </div>
        <!-- Jeu 3 -->
        <div class="game-card">
            <div class="game-screen">⚡ Naruto Storm</div>
            <div class="game-title">Ninja Mobile</div>
            <button class="btn-download" onclick="lancerJeu('Ninja Mobile')">Télécharger & Jouer</button>
        </div>
    </div>

    <!-- Interface du Lecteur de Jeu en Mode Paysage (PSP / PS Style) -->
    <div id="game-emulator-screen">
        <div class="emulator-top-bar">
            <button class="btn-back" onclick="quitterJeu()">Quitter ⬅</button>
            <div id="active-game-title" style="font-weight: bold; color: #60a5fa;">Jeu en cours</div>
            <div style="font-size: 12px; color: #10b981;">● Mode Hors Ligne</div>
        </div>

        <!-- Grand écran horizontal du jeu -->
        <div class="emulator-viewport" id="viewport-screen">
            Jeu en cours d'exécution... Profite de l'écran large !
        </div>

        <!-- Boutons de manette tactiles façon console portable -->
        <div class="emulator-controls">
            <!-- Croix directionnelle à gauche -->
            <div class="d-pad">
                <div></div><div class="ps-btn">⬆️</div><div></div>
                <div class="ps-btn">⬅️</div><div style="width:40px;height:40px;"></div><div class="ps-btn">➡️</div>
                <div></div><div class="ps-btn">⬇️</div><div></div>
            </div>

            <!-- Boutons d'action à droite (Carré, Croix, Rond, Triangle) -->
            <div class="action-buttons">
                <div></div><div class="ps-btn">🔺</div><div></div>
                <div class="ps-btn">⬛</div><div style="width:40px;height:40px;"></div><div class="ps-btn">⭕</div>
                <div></div><div class="ps-btn">❌</div><div></div>
            </div>
        </div>
    </div>

    <script>
        function lancerJeu(nomDuJeu) {
            // Affiche l'écran de jeu horizontal plein écran
            document.getElementById('active-game-title').innerText = nomDuJeu;
            document.getElementById('game-emulator-screen').style.display = 'flex';
            
            // Tentative de verrouillage de l'écran en mode paysage sur mobile (si supporté par le navigateur)
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function() {
                    // Ignorer si non supporté ou refusé par le navigateur
                });
            }
        }

        function quitterJeu() {
            // Ferme l'émulateur et revient au menu
            document.getElementById('game-emulator-screen').style.display = 'none';
        }
    </script>

</body>
</html>
