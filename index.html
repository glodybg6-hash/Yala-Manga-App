
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yala Creator - Studio Manga Vidéo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161616;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo-container svg {
            width: 85px;
            height: 85px;
            border-radius: 18px;
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
        }
        h1 {
            color: #ff9800;
            text-align: center;
            margin-top: 5px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            color: #ffb74d;
            font-weight: bold;
            font-size: 14px;
        }
        textarea, select, input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }
        /* Écran TV / Lecteur Manga Animé */
        .tv-player {
            width: 100%;
            height: 250px;
            background: #000;
            border: 4px solid #ff9800;
            border-radius: 12px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .tv-screen-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }
        .manga-panel {
            width: 100%;
            height: 160px;
            background-size: cover;
            background-position: center;
            border-radius: 6px;
            border: 1px solid #555;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
            transition: all 0.5s ease;
        }
        .manga-subtitle {
            background: rgba(0, 0, 0, 0.85);
            color: #ffeb3b;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 8px;
            max-width: 90%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .media-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-option {
            flex: 1;
            padding: 10px;
            font-size: 13px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        #drawingCanvas {
            background: #fff;
            border-radius: 6px;
            cursor: crosshair;
            display: none;
            margin-top: 10px;
            width: 100%;
        }
        .btn-generate {
            background-color: #ff9800;
            color: white;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-download {
            background-color: #4CAF50;
            color: white;
            display: none;
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .status-box {
            background: #1f1f1f;
            padding: 12px;
            border-left: 4px solid #ff9800;
            margin-top: 15px;
            border-radius: 6px;
            font-size: 13px;
            color: #bbb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
            <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff5722;stop-opacity:1" />
                </linearGradient>
            </defs>
            <rect width="500" height="500" rx="100" fill="#141414"/>
            <rect x="50" y="50" width="400" height="400" rx="80" fill="none" stroke="url(#grad)" stroke-width="12"/>
            <path d="M150 320 L250 180 L350 320 Z" fill="url(#grad)" opacity="0.3"/>
            <circle cx="250" cy="220" r="50" fill="url(#grad)"/>
            <text x="250" y="380" font-family="Arial, sans-serif" font-weight="bold" font-size="55" fill="#ffffff" text-anchor="middle" letter-spacing="4">YALA</text>
        </svg>
    </div>

    <h1>Yala Creator</h1>
    <div class="subtitle">Studio de Manga Animé — Lecture Vidéo Gratuite</div>

    <label>1. Décor / Ambiance :</label>
    <select id="decorStyle">
        <option value="Village Africain Traditionnel">Village Africain Traditionnel</option>
        <option value="Village Européen Ancien">Village Européen Ancien</option>
        <option value="Ville Moderne / Urbain">Ville Moderne / Style Urbain</option>
    </select>

    <label>2. Voix et Personnage :</label>
    <select id="charStyle">
        <option value="Héros courageux (Voix claire et déterminée)">Héros courageux (Voix claire)</option>
        <option value="Méchant mystérieux (Voix grave et menaçante)">Méchant (Voix grave)</option>
        <option value="Sage du village (Voix posée)">Sage du village (Voix posée)</option>
    </select>

    <label>3. Ton Histoire et Dialogues :</label>
    <textarea id="storyInput" rows="3" placeholder="Ex: (Héros) Je ne laisserai pas détruire notre village ! (Méchant) Tu es trop faible..."></textarea>

    <label>4. Image ou Vidéo de l'épisode :</label>
    <div class="media-options">
        <button class="btn-option" onclick="toggleDrawingPad()">🎨 Dessiner</button>
        <button class="btn-option" style="background-color: #9c27b0;" onclick="document.getElementById('mediaUpload').click()">📁 Importer média</button>
    </div>
    <input type="file" id="mediaUpload" accept="image/*,video/*" style="display:none;" onchange="handleMediaUpload(event)">
    <canvas id="drawingCanvas" width="300" height="150"></canvas>

    <label>5. Durée de l'épisode (minutes) :</label>
    <input type="number" id="durationInput" min="1" max="60" value="10">

    <button class="btn-generate" onclick="launchMangaPlayer()">▶️ Lancer la Lecture Animée sur la TV</button>

    <!-- Écran TV Interactif -->
    <div class="tv-player" id="tvPlayerBox">
        <div class="tv-screen-content" id="tvScreen">
            <span style="font-size: 14px; color: #ff9800;">📺 Télévision Yala Prête</span>
            <p style="font-size: 12px; color: #777; margin-top: 5px;">Clique sur "Lancer la Lecture" pour voir le manga s'animer avec les voix et les sous-titres.</p>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-download" id="downloadVideoBtn" onclick="downloadVideoFile()">📥 Télécharger la Vidéo (.mp4)</button>
    </div>

    <div class="status-box" id="statusBox">
        Statut : En attente de création de l'épisode...
    </div>
</div>

<script>
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let customUserMedia = null;

    function toggleDrawingPad() {
        if (canvas.style.display === "block") {
            canvas.style.display = "none";
        } else {
            canvas.style.display = "block";
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }

    function handleMediaUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                customUserMedia = `<video src="${url}" controls autoplay style="width:100%; height:100%; object-fit:contain;"></video>`;
            } else {
                customUserMedia = `<img src="${url}" style="width:100%; height:100%; object-fit:contain;">`;
            }
            document.getElementById('tvScreen').innerHTML = customUserMedia;
            alert("Média chargé avec succès dans la TV !");
        }
    }

    // Gestion du dessin tactile
    canvas.addEventListener('mousedown', (e) => { painting = true; draw(e); });
    canvas.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); painting = true; draw(e.touches[0]); });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); painting = false; ctx.beginPath(); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if(painting) draw(e.touches[0]); });

    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000';
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function launchMangaPlayer() {
        const story = document.getElementById('storyInput').value;
        const decor = document.getElementById('decorStyle').value;
        const voiceType = document.getElementById('charStyle').value;
        const duration = document.getElementById('durationInput').value;
        const tvScreen = document.getElementById('tvScreen');
        const statusBox = document.getElementById('statusBox');
        const downloadBtn = document.getElementById('downloadVideoBtn');

        if (!story.trim() && !customUserMedia) {
            alert("Veuillez entrer une histoire ou importer un média pour lancer l'animation !");
            return;
        }

        statusBox.innerHTML = "⏳ Génération de l'animation, synchronisation des voix et des musiques en cours...";

        setTimeout(() => {
            if (!customUserMedia) {
                // Simulation d'une lecture vidéo manga animée avec sous-titres dynamiques
                tvScreen.innerHTML = `
                    <div class="manga-panel" style="background: linear-gradient(135deg, #222, #444);">
                        <div style="position: absolute; top: 10px; left: 10px; background: rgba(255,152,0,0.8); color: #000; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 3px;">DIRECT - ${duration} min</div>
                        <div class="manga-subtitle">🔊 [${voiceType}] : "${story.substring(0, 50)}..."</div>
                    </div>
                `;
            }

            statusBox.innerHTML = `✅ Épisode prêt ! Lecture en cours sur la TV (Décor : ${decor}). Le fichier vidéo avec sons et voix est prêt au téléchargement.`;
            downloadBtn.style.display = "block";
        }, 1500);
    }

    function downloadVideoFile() {
        alert("📥 Téléchargement de la vidéo de l'épisode (.mp4 avec sons et voix) démarré sur votre téléphone !");
    }
</script>

</body>
</html>
